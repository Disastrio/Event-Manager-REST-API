services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/campus_events
      # Set JWT_SECRET in the shell or a local .env file before using this
      # compose file. The fallback is only for a throwaway local demo.
      JWT_SECRET: ${JWT_SECRET:-local-demo-only-change-this-secret-32chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10}
      ADMIN_NAME: ${ADMIN_NAME:-Platform Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@campus.edu}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      SEED_SAMPLE_DATA: ${SEED_SAMPLE_DATA:-true}

volumes:
  mongo-data:
